<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Get in touch with White Water Rafting Company. Contact us for general inquiries, reservation questions, or stop by our office in Kolob, California.">
    <meta name="author" content="Solomon Umoh">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us | White Water Rafting</title>
</head>

<body>

    <header>
        <div class="logo">
            <img src="images/z-wwr-crossedoars.png" alt="White Water Rafting Logo"
              title="White Water Rafting Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">

        <section class="company-heading">
            <h1>White Water Rafting Company</h1>
            <p>VXVG+7MP, SARS Rd, Port Harcourt 500102,<br>
                Rivers State<br>
                +2349028995221<br>
                info@waterrafting.com</p>
        </section>


        <section class="map-form-container">

            <div class="map-box">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3975.277318870428!2d6.9709066736278125!3d4.893169019883047!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1069d1305ac4e347%3A0x3b19c689a4bc7eb6!2sCedarwood%20Garden%20Estate!5e0!3m2!1sen!2sng!4v1791157168577!5m2!1sen!2sng"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>


            <form action="#" method="post" class="contact-form">
                <div class="form-row">
                    <label for="username">Name</label>
                    <input type="text" id="username" name="username" required
                      placeholder="Placeholder">
                </div>

                <div class="form-row">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" required
                      placeholder="Placeholder">
                </div>


                <fieldset class="form-radio-group">
                    <legend>Message Purpose</legend>
                    <div class="radio-options-wrapper">
                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="reservation" name="purpose" value="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </div>
                </fieldset>

                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required
                      placeholder="Type here"></textarea>
                </div>

                <div class="form-checkbox">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please Subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </section>


        <section class="team-section">
            <h2>We Are Here to Serve You</h2>
            <div class="team-grid">
                <figure class="profile-card">
                    <img src="images/john-doe.jpg" alt="John Doe, Founder & Lead Guide">
                    <figcaption><strong>John Doe</strong><br>Founder & Lead Guide</figcaption>
                </figure>
                <figure class="profile-card">
                    <img src="images/jane-smith.jpg" alt="Jane Smith, Booking Coordinator">
                    <figcaption><strong>Jane Smith</strong><br>Booking Coordinator</figcaption>
                </figure>
                <figure class="profile-card">
                    <img src="images/solomon-umoh.jpg" alt="Solomon Umoh, Safety Director">
                    <figcaption><strong>Solomon Umoh</strong><br>Safety Director</figcaption>
                </figure>
            </div>
        </section>
    </main>


    <footer>
        <p>&copy; 2026 | White Water Rafting Company | Solomon Umoh</p>

        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
